services:
  postgres:
    image: postgres:16
    container_name: nurix_postgres
    environment:
      POSTGRES_DB: nurix_db
      POSTGRES_USER: nurix_user
      POSTGRES_PASSWORD: nurix_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Job Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #messages { margin-top: 20px; border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; }
        .message { margin-bottom: 5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .status-PENDING { color: orange; }
        .status-RUNNING { color: blue; }
        .status-COMPLETED { color: green; }
        .status-FAILED { color: red; }
    </style>
</head>
<body>
    <h2>Distributed Task Queue Monitor</h2>
    
    <div>
        <label>Tenant ID: <input type="text" id="tenantId" value="tenant-1"></label>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()" disabled id="disconnectBtn">Disconnect</button>
    </div>

    <div id="connectionStatus" style="margin-top: 10px; font-weight: bold;">Disconnected</div>

    <h3>Job Feed</h3>
    <div id="messages"></div>

    <script>
        var stompClient = null;

        function setConnected(connected) {
            document.getElementById('disconnectBtn').disabled = !connected;
            document.getElementById('connectionStatus').innerText = connected ? 'Connected' : 'Disconnected';
            document.getElementById('connectionStatus').style.color = connected ? 'green' : 'red';
        }

        function connect() {
            var tenantId = document.getElementById('tenantId').value;
            var socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function (frame) {
                setConnected(true);
                console.log('Connected: ' + frame);
                
                // Subscribe to updates
                stompClient.subscribe('/topic/jobs/' + tenantId, function (message) {
                    showJobUpdate(JSON.parse(message.body));
                });

                // Request initial state (Subscription mapping)
                stompClient.subscribe('/app/jobs/' + tenantId, function (message) {
                    var jobs = JSON.parse(message.body);
                    jobs.forEach(showJobUpdate);
                });

            }, function(error) {
                console.log('STOMP error ' + error);
                setConnected(false);
            });
        }

        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            setConnected(false);
            console.log("Disconnected");
        }

        function showJobUpdate(job) {
            var messagesDiv = document.getElementById('messages');
            var msgElement = document.createElement('div');
            msgElement.className = 'message';
            msgElement.innerHTML = `
                <span style="font-size: 0.8em; color: gray;">${new Date().toLocaleTimeString()}</span>
                <strong>[${job.tenantId}]</strong> Job ${job.id} 
                <span class="status-${job.status}">${job.status}</span>
                (Retry: ${job.retryCount}/${job.maxRetries})
            `;
            messagesDiv.insertBefore(msgElement, messagesDiv.firstChild);
        }
    </script>
</body>
</html>

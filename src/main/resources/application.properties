spring.application.name=Nurix-Assignment

# Default Quotas
app.ratelimit.default-requests-per-minute=10
app.ratelimit.default-concurrent-jobs=5

spring.datasource.url=jdbc:postgresql://localhost:5432/nurix_db
spring.datasource.username=nurix_user
spring.datasource.password=nurix_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
